<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500">
  <defs>
    
    <linearGradient id="bg" x1="0" y1="0" x2="1544" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a202c"></stop>
      <stop offset="0.55" stop-color="#272d52"></stop>
      <stop offset="1" stop-color="#4c51bf"></stop>
    </linearGradient>

    
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="22" r="1.5" fill="#ffffff" fill-opacity="0.07"></circle>
    </pattern>

    
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"></stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
    </radialGradient>

    
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"></feGaussianBlur>
      <feOffset dx="0" dy="18"></feOffset>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"></feFuncA></feComponentTransfer>
      <feMerge><feMergeNode></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>

    
    <radialGradient id="cookieMini" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#fef3c7"></stop>
      <stop offset="0.55" stop-color="#f3d68f"></stop>
      <stop offset="1" stop-color="#c89352"></stop>
    </radialGradient>
  </defs>

  
  <rect width="1544" height="500" fill="url(#bg)"></rect>
  <rect width="1544" height="500" fill="url(#dots)"></rect>
  <circle cx="1100" cy="60" r="320" fill="url(#orb)"></circle>
  <circle cx="240" cy="520" r="260" fill="url(#orb)"></circle>

  
  <g opacity="0.07" stroke="#ffffff" fill="none">
    <circle cx="1500" cy="480" r="170" stroke-width="2"></circle>
    <circle cx="1455" cy="445" r="9" fill="#ffffff" stroke="none"></circle>
    <circle cx="1510" cy="470" r="7" fill="#ffffff" stroke="none"></circle>
    <circle cx="1470" cy="515" r="8" fill="#ffffff" stroke="none"></circle>
    <circle cx="1535" cy="425" r="5" fill="#ffffff" stroke="none"></circle>
  </g>

  
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    
    <text x="80" y="200" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-3">Cookie-Consent</text>

    
    <rect x="80" y="222" width="84" height="6" rx="3" fill="#9b6b5a"></rect>

    
    <text x="80" y="278" font-size="26" font-weight="500" fill="#cbd5e0">Bannière RGPD · CNIL · Google Consent Mode v2</text>

    
    <g transform="translate(80 358)">
      
      <g>
        <rect width="234" height="46" rx="23" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.22"></rect>
        
        <g transform="translate(16 14)">
          <clipPath id="flagClip"><rect width="24" height="18" rx="3"></rect></clipPath>
          <g clip-path="url(#flagClip)">
            <rect width="8" height="18" fill="#0055a4"></rect>
            <rect x="8" width="8" height="18" fill="#ffffff"></rect>
            <rect x="16" width="8" height="18" fill="#ef4135"></rect>
          </g>
        </g>
        <text x="52" y="30" font-size="15" font-weight="600" fill="#ffffff">Made in France</text>
      </g>

      
      <g transform="translate(252 0)">
        <rect width="240" height="46" rx="23" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.22"></rect>
        
        <g transform="translate(20 23)" fill="#ffffff">
          <circle r="3"></circle>
          <circle cx="0" cy="-8" r="2.6"></circle>
          <circle cx="-7" cy="5" r="2.6"></circle>
          <circle cx="7" cy="5" r="2.6"></circle>
          <g stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round">
            <line x1="0" y1="-3" x2="0" y2="-6"></line>
            <line x1="-2.2" y1="2" x2="-5" y2="3.6"></line>
            <line x1="2.2" y1="2" x2="5" y2="3.6"></line>
          </g>
        </g>
        <text x="46" y="30" font-size="15" font-weight="600" fill="#ffffff">Open Source · GPL v2</text>
      </g>

      
      <g transform="translate(508 0)">
        <rect width="196" height="46" rx="23" fill="#9b6b5a" fill-opacity="0.22" stroke="#9b6b5a" stroke-opacity="0.65"></rect>
        
        <g transform="translate(20 23)" fill="none" stroke="#f6c89c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M -7 -6 Q 0 -9, 7 -6 L 7 2 Q 0 9, -7 2 Z"></path>
          <line x1="-9" y1="-8" x2="9" y2="8"></line>
        </g>
        <text x="46" y="30" font-size="15" font-weight="600" fill="#ffffff">Zero Tracking</text>
      </g>
    </g>

    
    <text x="80" y="450" font-size="13" font-weight="600" fill="#a0aec0" letter-spacing="3.5">BY  SYNAPXLAB</text>
  </g>

  
  <g transform="translate(1230 260) rotate(-7)">
    <g filter="url(#cardShadow)">
      <g transform="translate(-260 -185)">
        
        <rect width="520" height="370" rx="22" fill="#ffffff"></rect>

        
        <rect x="0" y="0" width="520" height="6" rx="3" fill="#9b6b5a"></rect>

        
        <g transform="translate(50 60)">
          <circle r="18" fill="url(#cookieMini)"></circle>
          <circle cx="-5" cy="-4" r="3" fill="#3d2010"></circle>
          <circle cx="6" cy="2" r="2.6" fill="#3d2010"></circle>
          <circle cx="-3" cy="8" r="2.4" fill="#3d2010"></circle>
        </g>

        
        <text x="84" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1a202c">Paramètres des cookies</text>

        
        <text x="36" y="128" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#4a5568">Nous utilisons des cookies pour analyser le trafic</text>
        <text x="36" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#4a5568">et améliorer votre expérience sur notre site.</text>

        
        <g transform="translate(36 200)">
          <rect width="206" height="54" rx="10" fill="#9b6b5a"></rect>
          <text x="103" y="34" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Tout accepter</text>
        </g>
        <g transform="translate(262 200)">
          <rect width="222" height="54" rx="10" fill="#ffffff" stroke="#9b6b5a" stroke-width="2"></rect>
          <text x="111" y="34" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#9b6b5a" text-anchor="middle">Tout refuser</text>
        </g>

        
        <g transform="translate(36 292)">
          <text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4c51bf">Personnaliser mes choix</text>
          <rect x="0" y="6" width="190" height="1.5" fill="#4c51bf"></rect>
        </g>
      </g>
    </g>
  </g>
</svg>